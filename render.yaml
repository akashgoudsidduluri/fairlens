services:
  - type: web
    name: fairlens-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash render-start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FAIRLENS_SERVICE_HOST
        value: 0.0.0.0
      - key: PYTHONPATH
        value: .
